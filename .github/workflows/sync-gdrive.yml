name: Sync Google Drive

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Enables your manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google Drive Downloader Tool
        run: |
          pip install gdown

      - name: Download Whole Folder from Google Drive
        run: |
          # Recursively downloads your entire folder structure into a temporary directory
          gdown --folder "https://google.com{{ secrets.GDRIVE_FOLDER_ID }}"

          # Combines all the text/markdown files inside that folder into your main AGENTS.md
          cat * ./* 2>/dev/null | grep -v '^$' > ./AGENTS.md || true

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md
          git commit -m "Cloud Sync: Updated all instructions from Google Drive Folder" || exit 0
          git push
