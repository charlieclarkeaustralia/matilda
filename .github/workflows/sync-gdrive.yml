name: Sync Google Drive

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every single hour
  workflow_dispatch: # Enables your manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Official Google Drive Client
        run: |
          pip install google-api-python-client google-auth

      - name: Authenticate to Google Cloud Natively
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          token_format: 'access_token'
 access_token_scopes: 'https://googleapis.com'
      - name: Download Whole Folder from Google Drive API
        run: |
          cat << 'EOF' > download_folder.py
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          # Uses the freshly validated token directly from the official auth step
          access_token = os.environ['GOOGLE_ACCESS_TOKEN']
          creds = Credentials(token=access_token)

          drive_service = build('drive', 'v3', credentials=creds)
          folder_id = os.environ['GDRIVE_FOLDER_ID']

          try:
              results = drive_service.files().list(
                  q=f"'{folder_id}' in parents and trashed = false",
                  fields="files(id, name, mimeType)"
              ).execute()
              files = results.get('files', [])

              with open('./AGENTS.md', 'w', encoding='utf-8') as agents_file:
                  for f in files:
                      if 'document' in f['mimeType'] or 'markdown' in f['mimeType'] or 'text' in f['mimeType']:
                          print(f"Downloading file: {f['name']}")
                          
                          if 'google-apps.document' in f['mimeType']:
                              content = drive_service.files().export(
                                  fileId=f['id'], mimeType='text/plain'
                              ).execute()
                          else:
                              content = drive_service.files().get_media(fileId=f['id']).execute()
                              
                          agents_file.write(f"\n\n# --- File: {f['name']} ---\n")
                          agents_file.write(content.decode('utf-8'))
                          
          except HttpError as error:
              print(f"An error occurred: {error}")
              exit(1)
          EOF

          python download_folder.py
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add AGENTS.md
          git commit -m "Cloud Sync: Safely compiled rules from Google Drive" || exit 0
          git push
