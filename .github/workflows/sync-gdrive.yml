name: Sync Google Drive

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Enables your manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Cloud Sync Tool
        run: |
          sudo rclone self-update || true
          
      - name: Configure and Sync Google Drive Folder
        run: |
          # 1. Create a secure folder configuration for rclone using your service account
          mkdir -p ~/.config/rclone
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > ~/.config/rclone/sa.json
          
          cat <<EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive.readonly
          service_account_file = ~/.config/rclone/sa.json
          root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}
          EOF

          # 2. Download all files recursively and automatically convert Google Docs to flat markdown
          mkdir -p ./gdrive_files
          rclone copy gdrive: ./gdrive_files --drive-export-formats md --fast-list -vv || true

          # 3. Safely compile every single downloaded file stream directly into your primary AGENTS.md file
          cat $(find ./gdrive_files -type f) 2>/dev/null | grep -v '^$' > ./AGENTS.md || echo "# Project Rules" > ./AGENTS.md
          
          # Clean up temporary folder
          rm -rf ./gdrive_files ~/.config/rclone/sa.json

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add AGENTS.md
          git commit -m "Cloud Sync: Deep subfolder compilation complete" || exit 0
          git push
