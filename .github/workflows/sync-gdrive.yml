name: Sync Google Drive

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every hour
  workflow_dispatch: # Enables your manual "Run workflow" button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Download File from Google Drive
        run: |
          # Securely fetches your Google doc file directly using your stored credentials
          curl -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -o ./AGENTS.md \
            "https://googleapis.com{{ secrets.GDRIVE_FOLDER_ID }}?alt=media"

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add AGENTS.md
          git commit -m "Cloud Sync: Updated instructions from Google Drive" || exit 0
          git push
