name: Sync Google Drive

on:
  schedule:
    - cron: '0 * * * *' # Automatically runs every single hour
  workflow_dispatch: # Allows manual trigger button click

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Google Drive Downloader Tool
        run: |
          pip install gdown

      - name: Download Folder with Service Account Credentials
        run: |
          # Saves your secure JSON key temporarily onto the runner disk
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > service_account.json
          
          # Downloads your folder using full service account authentication
          gdown --folder "https://google.com{{ secrets.GDRIVE_FOLDER_ID }}" --service-account service_account.json

          # Clean up the key file right after download for security
          rm service_account.json

          # Combines all text data found in the folder wrapper into your root context file
          cat * ./* 2>/dev/null | grep -v '^$' > ./AGENTS.md || true

      - name: Commit and Push Changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add AGENTS.md
          git commit -m "Cloud Sync: Safely updated all instructions from Google Drive" || exit 0
          git push
